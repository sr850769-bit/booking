<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>美睫線上預約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 安靜、溫暖、像一張精緻的店家名片
   IDEA: 一本店家服務目錄，翻到想要的項目就能直接預約
   PICTURE: 灰褐漸層的店家封面，圓形店標、店名與資訊膠囊
   COLOUR and TYPE: 米白底、白色卡片、奶茶金按鈕、深墨字；思源黑體
   LAYOUT: 單欄最寬640px，黏頂分頁，分類標題加數量，預約流程用底部彈出視窗 */
:root{color-scheme:light dark;--bg:light-dark(#f5f2ec,#17150f);--card:light-dark(#ffffff,#221f19);--ink:light-dark(#2b2620,#f2ece2);--mute:light-dark(#8b8277,#a89e90);--soft:light-dark(#efe9df,#2e2a22);--line:light-dark(#ebe4d8,#36312a);--gold:light-dark(#c8a96a,#cfae6c);--goldink:#2d2414;--ok:light-dark(#3d7f58,#7cc79a);--warn:light-dark(#a8722a,#e3b06a);--danger:light-dark(#b23b30,#ef8b80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.hero{background:linear-gradient(180deg,#5e5a54 0%,#8d877e 45%,#d8d2c8 100%);color:#fff;text-align:center;padding:40px 16px 34px}
.logo{width:84px;height:84px;border-radius:22px;background:#fff;margin:0 auto 14px;display:grid;place-items:center;color:#5e5a54;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.logo svg{width:54px;height:34px}
.hero h1{font:700 clamp(26px,6vw,34px)/1.15 "Noto Sans TC",sans-serif;margin:0 0 14px;letter-spacing:.04em;text-wrap:balance;text-shadow:0 1px 6px rgba(0,0,0,.2)}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:18px}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(40,36,30,.55);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap;color:#fff;text-decoration:none}
.pill svg{width:14px;height:14px}
.cta{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--gold);color:var(--goldink);font-weight:700;padding:11px 22px;min-height:46px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px 12px}
.bar button{border:0;background:none;border-radius:999px;padding:8px 16px;min-height:42px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--mute)}
.bar button.on{background:#2b2620;color:#fff;font-weight:700}
:root[data-theme=dark] .bar button.on{background:#f2ece2;color:#17150f}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .bar button.on{background:#f2ece2;color:#17150f}}
.bar .n{background:rgba(255,255,255,.22);border-radius:999px;padding:0 7px;font-size:12px}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 48px}
.notice{white-space:pre-line;font-size:15px;line-height:1.75;margin:4px 0 16px}
.notice b{font-size:18px}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 22px}
.lk{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:8px 14px;min-height:40px;color:var(--ink);text-decoration:none;font-size:14px}
.lk svg{width:16px;height:16px}
.cat{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px;font-weight:500;letter-spacing:.08em;margin:22px 0 10px}
.cnt{background:var(--soft);border-radius:999px;padding:0 8px;font-size:12px;letter-spacing:0}
.svc{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.thumb{width:64px;height:64px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--gold);overflow:hidden}
.thumb svg{width:40px;height:26px}
.svc h3{margin:0;font-size:16px;line-height:1.35}
.svc .d{margin:3px 0 6px;color:var(--mute);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.price{font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dur{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--mute);white-space:nowrap}
.dur svg{width:12px;height:12px}
.mem{font-size:12px;color:var(--gold);font-weight:700;white-space:nowrap}
.go{border:0;border-radius:999px;background:var(--gold);color:var(--goldink);font-weight:700;padding:8px 18px;min-height:40px;cursor:pointer;white-space:nowrap}
@media(max-width:420px){.svc{grid-template-columns:56px 1fr;gap:12px}.thumb{width:56px;height:56px}.svc .go{grid-column:1/-1;width:100%}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.empty{color:var(--mute);text-align:center;padding:28px 8px}
.demo{font-size:12px;color:var(--mute);text-align:center;margin-top:20px}
.demo a{color:inherit}
/* 彈出視窗 */
.mask{position:fixed;inset:0;z-index:20;background:rgba(30,26,20,.45);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.mask{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:680px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .25s ease-out}
@media(min-width:700px){.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.sh h2{margin:0;font-size:18px}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;font-size:18px;line-height:1}
.prog{display:flex;gap:6px;padding:14px 20px 0}
.prog i{flex:1;height:3px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--gold)}
.sb{padding:10px 20px 18px;overflow-y:auto;flex:1}
.stepno{font-size:13px;color:var(--mute);margin:0}
.sum1{font-size:14px;font-weight:700;margin:0 0 12px}
.hint{font-size:14px;color:var(--mute);margin:0 0 12px}
.sf{padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);text-align:center}
.sf .tip{font-size:13px;color:var(--mute);margin:0 0 8px}
.sf .row{display:flex;gap:10px}
.b1,.b2{flex:1;border:0;border-radius:14px;min-height:50px;font-weight:700;font-size:16px;cursor:pointer}
.b1{background:var(--gold);color:var(--goldink)}.b1:disabled{background:var(--soft);color:var(--mute);cursor:default}
.b2{background:var(--soft);color:var(--ink);font-weight:500}
.add{display:grid;grid-template-columns:46px 1fr;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.add .ic{width:46px;height:46px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:22px;color:var(--mute)}
.add.on{border-color:var(--gold)}.add.on .ic{background:var(--gold);color:var(--goldink)}
.add b{font-size:15px}.add p{margin:2px 0;font-size:13px;color:var(--mute)}
.dates{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media(max-width:480px){.dates{grid-template-columns:repeat(4,minmax(0,1fr))}}
.dt{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 2px;cursor:pointer;text-align:center}
.dt small{display:block;font-size:12px;color:var(--mute)}.dt b{font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.dt.on{border-color:var(--gold);background:var(--gold);color:var(--goldink)}.dt.on small{color:var(--goldink)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:16px;font-variant-numeric:tabular-nums}
.slot:disabled{text-decoration:line-through;opacity:.35;cursor:default}
.slot.on{border-color:var(--gold);background:var(--gold);color:var(--goldink);font-weight:700}
label{display:block;font-weight:500;font-size:14px;margin:12px 0 4px}
label em{color:var(--danger);font-style:normal}
input,textarea{width:100%;font:16px "Noto Sans TC",sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.seg{display:flex;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:8px 12px;font-size:15px;cursor:pointer;flex:1}
.chip.on{border-color:var(--gold);background:var(--soft);font-weight:700}
.sum{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;background:var(--soft);border-radius:14px;padding:12px 14px}
.sum span:nth-child(odd){color:var(--mute);white-space:nowrap}
.bank{border:1.5px dashed var(--gold);border-radius:14px;padding:12px 14px;margin:14px 0;font-size:15px}
.bank .r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0}
.bank .r span:first-child{color:var(--mute);white-space:nowrap}
.copy{border:0;background:var(--soft);color:var(--ink);border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer;min-height:34px;white-space:nowrap}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;margin-top:12px}
.check input{width:22px;height:22px;min-height:0;flex:none;margin-top:1px;accent-color:var(--gold)}
.err{color:var(--danger);background:light-dark(#fbecea,#3a201d);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.done{text-align:center;padding:8px 0}
.ring{width:64px;height:64px;border-radius:50%;background:var(--gold);color:var(--goldink);display:grid;place-items:center;margin:4px auto 10px;font-size:30px}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px;white-space:nowrap}
.b-wait{background:light-dark(#faefdc,#3d2e1a);color:var(--warn)}.b-ok{background:light-dark(#e3f2e8,#1d3326);color:var(--ok)}
.b-done{background:var(--soft);color:var(--mute)}.b-cancel{background:var(--soft);color:var(--mute);text-decoration:line-through}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item .t{font-weight:700;font-variant-numeric:tabular-nums}
.item p{margin:4px 0;font-size:14px}
.sub{color:var(--mute);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.inline{display:flex;gap:8px;margin-top:8px}.inline input{flex:1}.inline .go{min-height:46px}
.dayhead{font-weight:700;margin:18px 0 8px;font-size:15px;color:var(--gold)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:8px}.wk .chip{padding:8px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .w{font-size:12px;color:var(--mute);padding:4px 0}
.day{aspect-ratio:1;border:0;border-radius:10px;background:var(--soft);cursor:pointer;font-size:13px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day small{font-size:10px;color:var(--mute)}
.day.off{background:none;border:1.5px dashed var(--line);color:var(--mute)}
.day.mod{box-shadow:inset 0 0 0 2px var(--gold)}
.day:disabled{opacity:.35;cursor:default}
.calh{display:flex;align-items:center;justify-content:space-between;margin:10px 0 8px}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}
.icon:disabled{opacity:.3;cursor:default}
.wide{width:100%;margin-top:14px}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.bar{overflow-x:auto;scrollbar-width:none}.bar button{flex:none}
@media(max-width:560px){.bar{justify-content:flex-start}}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:22px}
.thumb img{width:100%;height:100%;object-fit:cover}
.svc.ed{grid-template-columns:64px 1fr}.svc.hid{opacity:.55}
.svc.ed .acts .chip{flex:none;min-height:40px;padding:6px 14px}
.icon.sm{width:40px;height:40px;flex:none}
.imgrow{display:flex;gap:14px;align-items:center;margin:10px 0}
.thumb.big{width:84px;height:84px}
.logo.sm{width:72px;height:72px;margin:0;border:1px solid var(--line);flex:none}
.up{position:relative;display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:999px;background:var(--soft);cursor:pointer;margin:0 6px 4px 0;font-size:14px;font-weight:500}
.up input{position:absolute;opacity:0;width:1px;height:1px}
.stat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat small{display:block;color:var(--mute);font-size:13px}.stat b{font-size:clamp(20px,5vw,26px);font-variant-numeric:tabular-nums;white-space:nowrap}
.hb{display:grid;grid-template-columns:5.5em 1fr auto;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.hb i{display:block;height:12px;border-radius:6px;background:var(--gold);min-width:2px}
.hb span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--mute)}
.mcv{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block;margin:10px 0}
.cellrow{display:grid;grid-template-columns:1.2fr 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.cellrow .full{grid-column:1/-1}
select{width:100%;font:16px "Noto Sans TC",sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px}
.colors{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.colors label{display:flex;align-items:center;gap:6px;margin:8px 0}
.colors input[type=color]{width:46px;height:40px;padding:2px;min-height:0}
.consent{max-height:160px;overflow:auto;white-space:pre-line;font-size:13px;background:var(--soft);border-radius:12px;padding:10px 12px;margin-top:12px}
.ok-t{color:var(--ok)}.warn-t{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw}
</style>
</head>
<body>
<div id="app"><p class="empty"><span class="spin"></span> 載入中…</p></div>
<div id="modal"></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
{
/* ====== 設定：部署後填入 ====== */
const CONFIG={
 API_URL:'https://script.google.com/macros/s/AKfycbx_0TqKnBZuKrwV1I7V3u_wOov-RA_bJtlmm-G5AkdynSeOowgUQHErU-bkehUmB-X7/exec', // Apps Script 部署後的網址
 LIFF_ID:'2012816481-rIj6o1DD' // LINE 內嵌網頁編號
};
/* ============================== */
const DEMO=!CONFIG.API_URL;
const ADMIN=location.hash==='#admin';
const app=document.getElementById('app'),modal=document.getElementById('modal');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'NT$'+Number(n||0).toLocaleString('zh-TW');
const WD='日一二三四五六';
function tpe(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const g=t=>(p.find(x=>x.type===t)||{}).value;return{date:`${g('year')}-${g('month')}-${g('day')}`,min:(+g('hour')%24)*60+(+g('minute'))};}
function addDays(ds,n){const p=ds.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]+n)).toISOString().slice(0,10);}
function wday(ds){const p=ds.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay();}
function nice(ds){const p=ds.split('-');return `${+p[1]}月${+p[2]}日（${WD[wday(ds)]}）`;}
function ymAdd(ym,n){const p=ym.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1+n,1)).toISOString().slice(0,7);}
const toMin=t=>{const p=String(t).split(':');return +p[0]*60+(+p[1]||0);};
const toHM=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
const pic=(src,cls)=>src?`<img class="${cls||''}" src="${esc(src)}" alt="">`:LASH;
async function shrink(file,max){const url=URL.createObjectURL(file);try{const img=new Image();await new Promise((r,j)=>{img.onload=r;img.onerror=j;img.src=url;});const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.75);}finally{URL.revokeObjectURL(url);}}
function toast(s){const t=document.createElement('div');t.className='toast';t.textContent=s;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}
const badge=s=>`<span class="badge ${({'待付訂金':'b-wait','已確認':'b-ok','已完成':'b-done','已取消':'b-cancel'})[s]||'b-done'}">${esc(s)}</span>`;
const LASH=`<svg viewBox="0 0 64 40" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 14c8 12 44 12 52 0"/><path d="M12 19l-5 9M19 22l-3 10M26 24l-1 10M33 24.5v10M40 24l1 10M47 22l3 10M53 19l5 9"/></svg>`;
const I={
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
 pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',

async function api(action,data,get){
 data=data||{};
 if(DEMO)return new Promise(r=>setTimeout(()=>r(demoHandle(action,data)),200));
 try{let r;
  if(get)r=await fetch(CONFIG.API_URL+'?'+new URLSearchParams(Object.assign({action},data)));
  else r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},data))});
  return await r.json();
 }catch(e){return{ok:false,error:'連線失敗，請檢查網路後再試一次'};}
}

  ${r.status==='待付訂金'&&r.payMethod!=='信用卡'?`<p style="margin:0 0 4px">請在 <b>${dp.hours} 小時內</b>匯款訂金 <b>${money(r.deposit)}</b>，逾時會自動取消。</p>${bankBox(dp)}<p class="sub">${B.f.last5?'已收到你填的後五碼，店家確認後會傳LINE通知你。':'匯款後到「我的預約」填寫後五碼，店家確認後會傳LINE通知你。'}</p>`:''}`;

function payMethod(){const p=cfg.pay||{transfer:true};if(B.pm&&((B.pm==='信用卡'&&p.card)||(B.pm==='轉帳'&&p.transfer)))return B.pm;return p.card?'信用卡':'轉帳';}

function enter(){const k=curKind();if(k==='date'&&!B.dates)loadDates();else if(k==='time')loadSlots();else renderModal();}
function validate(){const f=B.f;f.name=f.name.trim();f.phone=f.phone.replace(/[\s-]/g,'');if(!f.name)return'請填寫姓名';if(!/^09\d{8}$/.test(f.phone))return'手機號碼請填 09 開頭的10碼數字';if(f.last5&&!/^\d{5}$/.test(f.last5))return'匯款後五碼要是5位數字';if(cfg.consent&&!B.consent)return'請先閱讀並勾選同意書';if(!B.agree)return'請先勾選同意訂金規定';return'';}
async function clientAct(a,el){
 B.err='';
 if(a==='tab'){S.tab=el.dataset.v;if(S.tab==='mine'&&(DEMO||idToken))loadMine();else render();return;}
 if(a==='jump'){S.tab='svc';render();const c=document.getElementById('cat-0');if(c)c.scrollIntoView({behavior:'smooth',block:'start'});return;}
 if(a==='pick'){Object.assign(B,{open:true,step:1,svc:cfg.services.find(s=>s.id===el.dataset.id),add:[],date:'',time:'',slots:null,agree:false,consent:false,result:null,busy:false});enter();return;}
 if(a==='close'||(a==='maskclose'&&el===document.querySelector('.mask'))){if(B.busy)return;B.open=false;renderModal();return;}
 if(a==='addon'){const id=el.dataset.id;B.add=B.add.includes(id)?B.add.filter(x=>x!==id):B.add.concat(id);B.time='';renderModal();return;}
 if(a==='date'){B.date=el.dataset.v;B.time='';renderModal();return;}
 if(a==='time'){B.time=el.dataset.v;renderModal();return;}
 if(a==='first'){B.f.first=el.dataset.v;renderModal();return;}
 if(a==='nx'){B.step++;enter();return;}
 if(a==='bk'){B.step=Math.max(1,B.step-1);enter();return;}
 if(a==='copy'){try{await navigator.clipboard.writeText(el.dataset.v);toast('已複製');}catch(e){toast('無法複製，請長按文字自行複製');}return;}
 if(a==='submit'){
  const e=validate();if(e){B.err=e;renderModal();return;}
  B.busy=true;renderModal();
  const r=await api('book',Object.assign({serviceId:B.svc.id,addons:B.add,date:B.date,time:B.time,idToken,payMethod:payMethod(),consent:B.consent},B.f));
  B.busy=false;
  if(!r.ok){B.err=r.error||'送出失敗';if(/剛被預約走/.test(B.err)){B.step=steps().indexOf('time')+1;toast(B.err);loadSlots();return;}renderModal();return;}
  if(r.status==='待付訂金'&&r.payMethod==='信用卡'){B.busy=true;renderModal();const went=await goCard(r.id);if(went)return;B.busy=false;}
  B.result=r;B.f.last5='';B.f.note='';renderModal();return;
 }
 if(a==='pm'){B.pm=el.dataset.v;renderModal();return;}
 if(a==='cardMine'){el.disabled=true;const ok=await goCard(el.dataset.id);if(!ok)el.disabled=false;return;}
 if(a==='toMine'){B.open=false;renderModal();S.tab='mine';loadMine();return;}
 if(a==='pay'){const id=el.dataset.id;const v=(document.getElementById('l5-'+id)||{}).value||'';if(!/^\d{5}$/.test(v)){toast('請輸入5位數字');return;}el.disabled=true;const r=await api('pay',{idToken,id,last5:v});if(r.ok){toast('已送出，等待店家確認');loadMine();}else{toast(r.error);el.disabled=false;}return;}
}

function drawMenu(cv,m,img){
 const L=LAY[m.layout],W=cv.width,H=cv.height,x=cv.getContext&&cv.getContext('2d'),cw=W/L.c,ch=H/L.r;if(!x)return;
 if(img){const s=Math.max(W/img.width,H/img.height);x.drawImage(img,(W-img.width*s)/2,(H-img.height*s)/2,img.width*s,img.height*s);}
 else{
  x.fillStyle=m.bg;x.fillRect(0,0,W,H);
  x.strokeStyle=m.accent;x.lineWidth=Math.max(2,W/500);
  for(let i=1;i<L.c;i++){x.beginPath();x.moveTo(i*cw,H*0.08);x.lineTo(i*cw,H*0.92);x.stroke();}
  for(let j=1;j<L.r;j++){x.beginPath();x.moveTo(W*0.03,j*ch);x.lineTo(W*0.97,j*ch);x.stroke();}
  x.fillStyle=m.fg;x.textAlign='center';x.textBaseline='middle';
  m.cells.slice(0,L.c*L.r).forEach((c,i)=>{
   const cx=(i%L.c+.5)*cw,cy=(Math.floor(i/L.c)+.5)*ch,t=c.label||'';
   let fs=Math.min(ch*0.24,cw*0.8/Math.max(2,t.length));x.font=`700 ${fs}px "Noto Sans TC",sans-serif`;x.fillText(t,cx,cy);
   x.fillStyle=m.accent;x.fillRect(cx-fs*0.6,cy+fs*0.75,fs*1.2,Math.max(3,fs*0.07));x.fillStyle=m.fg;
  });
 }
}

 <label for="s-notice">公告（客人一進來就會看到）</label><textarea id="s-notice" style="min-height:170px">${esc(s.notice)}</textarea></div>
 <div class="card"><b>連結（不用的留空）</b>${f('s-ig','Instagram 網址',L.instagram)}${f('s-line','LINE 加好友網址',L.line)}${f('s-map','Google 地圖網址',L.map)}${f('s-email','Email',L.email,'email')}</div>
 <div class="card"><b>訂金與匯款</b><div class="two">${f('d-bank','銀行名稱',p.bank)}${f('d-code','銀行代碼',p.code)}</div>${f('d-account','帳號',p.account)}${f('d-name','戶名',p.name)}${f('d-hours','預約後幾小時內要付訂金',p.hours,'number')}<label for="d-policy">訂金規定（客人送出前要勾選同意）</label><textarea id="d-policy">${esc(p.policy)}</textarea></div>
 <div class="card"><b>付款方式</b>
 <label class="check"><input type="checkbox" id="o-transfer" ${o.transfer!==false?'checked':''}><span>銀行轉帳（客人填匯款後五碼，你手動確認）</span></label>
 <label class="check"><input type="checkbox" id="o-card" ${o.card?'checked':''}><span>線上刷卡（藍新金流，付款成功自動確認）</span></label>
 <p class="sub ${d.cardReady?'':'warn-t'}">${d.cardReady?(d.cardTest?'藍新：已設定，目前是<b>測試環境</b>，不會真的扣款。':'藍新：已設定，正式收款中。'):'藍新：還沒在 Apps Script 指令碼屬性填商店代號、HashKey、HashIV，刷卡暫時不會出現。'}</p></div>
 <div class="card"><b>金鑰設定</b><p class="sub" style="margin:4px 0 0">金鑰只存在後端，不會顯示出來。<b>留空代表不變更</b>，只有要設定或更換時才填。</p>
 <label for="k-mid">藍新 商店代號 ${d.cardReady?'<span class="ok-t">✔ 已設定</span>':''}</label><input id="k-mid" autocomplete="off" placeholder="${d.cardReady?'已設定，要更換才填':'例如 MS1234567890'}">
 <label for="k-key">藍新 HashKey（32 字元）</label><input id="k-key" type="password" autocomplete="new-password" placeholder="${d.cardReady?'已設定，要更換才填':''}">
 <label for="k-iv">藍新 HashIV（16 字元）</label><input id="k-iv" type="password" autocomplete="new-password" placeholder="${d.cardReady?'已設定，要更換才填':''}">
 <label class="check"><input type="checkbox" id="k-test" ${d.cardTest?'checked':''}><span>使用藍新測試環境（用測試站申請的金鑰時才勾，不會真的扣款）</span></label>
 <label for="k-line">LINE 頻道存取權杖 ${d.lineReady?'<span class="ok-t">✔ 已設定</span>':''}</label><input id="k-line" type="password" autocomplete="new-password" placeholder="${d.lineReady?'已設定，要更換才填':'從 LINE Developers 的 Messaging API 分頁複製'}">
 <button class="b2 wide" data-a="saveKeys" ${A.busy?'disabled':''}>儲存金鑰</button></div>
 <div class="card"><b>同意書（留空就不顯示）</b><label for="o-consent">客人送出預約前必須勾選同意</label><textarea id="o-consent" style="min-height:150px" placeholder="例如：嫁接前請告知是否有眼睛過敏、近期做過眼部手術…">${esc(o.consent||'')}</textarea></div>
 <div class="card"><b>其他</b>${f('o-email','通知 Email（新預約會寄到這裡）',o.email,'email')}${f('o-churn','超過幾天沒回來算流失客人',o.churn||30,'number')}${f('o-book','預約頁網址',o.bookUrl)}${f('o-liff','LINE 預約網址（LIFF）',o.liff)}</div>
 <button class="b1 wide" data-a="saveShop" ${A.busy?'disabled':''}>${A.busy?'<span class="spin"></span>':'儲存店家設定'}</button>`;
}
function readShop(){
 const v=id=>{const el=document.getElementById(id);return el?el.value.trim():null;};if(v('s-shop')===null)return;
 const s=A.data.shop,p=A.data.deposit;
 Object.assign(s,{shop:v('s-shop'),hours:v('s-hours'),phone:v('s-phone'),address:v('s-address'),notice:document.getElementById('s-notice').value,links:{instagram:v('s-ig'),line:v('s-line'),map:v('s-map'),email:v('s-email')}});
 if(A.data.other&&document.getElementById('o-card')){Object.assign(A.data.other,{transfer:document.getElementById('o-transfer').checked,card:document.getElementById('o-card').checked,consent:document.getElementById('o-consent').value.trim(),email:v('o-email'),churn:Math.max(1,Math.round(+v('o-churn')||30)),bookUrl:v('o-book'),liff:v('o-liff')});}
 Object.assign(p,{bank:v('d-bank'),code:v('d-code'),account:v('d-account'),name:v('d-name'),hours:Math.max(1,Math.round(+v('d-hours')||12)),policy:document.getElementById('d-policy').value.trim()});
}
async function saveItems(msg){const r=await api('adminSaveItems',{pw:A.pw,services:A.data.services,addons:A.data.addons});if(r.ok)toast(msg);else{toast(r.error||'儲存失敗');loadAdmin();}return r.ok;}
async function refreshCfg(){const r=await api('config',{},true);if(r.ok)cfg=r;}
async function loadAdmin(){const r=await api('adminData',{pw:A.pw});if(!r.ok){A.data=null;A.err=r.error;try{sessionStorage.removeItem('lash-admin-pw');}catch(e){}}else{A.data=r;A.err='';if(A.tab!=='menu')A.menu=null;try{sessionStorage.setItem('lash-admin-pw',A.pw);}catch(e){}}A.busy=false;renderAdmin();}
async function adminAct(a,el){
 if(a==='login'){A.pw=(document.getElementById('pw')||{}).value||'';if(!A.pw){A.err='請輸入密碼';renderAdmin();return;}A.busy=true;renderAdmin();loadAdmin();return;}
 if(a==='atab'){A.tab=el.dataset.v;renderAdmin();return;}
 if(a==='filter'){A.filter=el.dataset.v;renderAdmin();return;}
 if(a==='status'){const v=el.dataset.v;el.disabled=true;const r=await api('adminStatus',{pw:A.pw,id:el.dataset.id,status:v});if(r.ok){toast(v==='已確認'?'已確認，會通知客人':v==='已取消'?'已取消，會通知客人':'已標記完成');loadAdmin();}else{toast(r.error);el.disabled=false;}return;}
 if(a==='wk'){const i=+el.dataset.v,c=A.data.weekly.closed;A.data.weekly.closed=c.includes(i)?c.filter(x=>x!==i):c.concat(i).sort();renderAdmin();return;}
 if(a==='saveWeekly'){const s=document.getElementById('ws').value,e=document.getElementById('we').value;if(!s||!e||s>=e){toast('營業時間不正確');return;}const r=await api('adminWeekly',{pw:A.pw,closed:A.data.weekly.closed,start:s,end:e});if(r.ok){toast('已儲存');loadAdmin();}else toast(r.error);return;}
 if(a==='amon'){A.ym=ymAdd(A.ym,+el.dataset.v);renderAdmin();return;}
 if(a==='toggle'){const ds=el.dataset.v,d=A.data,e=effOpen(d,ds),want=e.open?'休':'營業';const def=!d.weekly.closed.includes(wday(ds));const state=(want==='營業')===def?'預設':want;
  const n=d.bookings.filter(b=>b.date===ds&&b.status!=='已取消').length;
  el.disabled=true;const r=await api('adminDay',{pw:A.pw,date:ds,state});
  if(r.ok){toast(`${nice(ds)} 設為${want==='休'?'公休':'營業'}${want==='休'&&n?`，這天還有 ${n} 筆預約，記得聯絡客人`:''}`);loadAdmin();}else{toast(r.error);el.disabled=false;}return;}
 if(a==='owner'){
  if(!DEMO&&!idToken){if(CONFIG.LIFF_ID&&window.liff){await initLiff(true);if(!idToken)return;}else{toast('請在LINE裡打開後台網址');return;}}
  const r=await api('adminSetOwner',{pw:A.pw,idToken});if(r.ok){toast('設定完成');loadAdmin();}else toast(r.error);return;}
 if(a==='newSvc'||a==='newAdd'){const svc=a==='newSvc';A.edit={k:svc?'svc':'add',i:-1,item:svc?{id:'S'+Date.now().toString(36),cat:(A.data.services[0]||{}).cat||'',name:'',desc:'',price:'',member:0,dur:'',deposit:300,img:'',on:true}:{id:'A'+Date.now().toString(36),name:'',desc:'',price:'',member:0,dur:0,on:true}};renderEdit();return;}
 if(a==='edit'){const k=el.dataset.k,arr=k==='svc'?A.data.services:A.data.addons;A.edit={k,i:+el.dataset.i,item:clone(arr[+el.dataset.i])};renderEdit();return;}
 if(a==='edClose'){if(!A.busy){A.edit=null;renderEdit();}return;}
 if(a==='rmImg'){A.edit.item.img='';renderEdit();return;}
 if(a==='del'){A.edit.del=true;renderEdit();return;}
 if(a==='delNo'){A.edit.del=false;renderEdit();return;}
 if(a==='delYes'){const arr=A.edit.k==='svc'?A.data.services:A.data.addons;const nm=A.edit.item.name;arr.splice(A.edit.i,1);A.edit=null;renderEdit();renderAdmin();await saveItems(`已刪除「${nm}」`);return;}
 if(a==='saveItem'){const e=A.edit,it=e.item,svc=e.k==='svc';it.name=String(it.name||'').trim();if(svc)it.cat=String(it.cat||'').trim()||'其他';for(const k of ['price','member','dur','deposit'])if(k in it)it[k]=Math.max(0,Math.round(+it[k]||0));
  if(!it.name){e.err='請填寫名稱';renderEdit();return;}if(svc&&!it.dur){e.err='請填寫服務時間';renderEdit();return;}
  const arr=svc?A.data.services:A.data.addons;if(e.i<0){if(svc){let j=-1;arr.forEach((s,n)=>{if(s.cat===it.cat)j=n;});if(j<0)arr.push(it);else arr.splice(j+1,0,it);}else arr.push(it);}else arr[e.i]=it;
  A.busy=true;renderEdit();const ok=await saveItems('已儲存');A.busy=false;if(ok){A.edit=null;renderEdit();renderAdmin();}else renderEdit();return;}
 if(a==='onoff'){const arr=el.dataset.k==='svc'?A.data.services:A.data.addons,s=arr[+el.dataset.i];s.on=s.on===false;renderAdmin();await saveItems(s.on?`「${s.name}」已上架`:`「${s.name}」已下架，客人看不到`);return;}
 if(a==='mv'){const svc=el.dataset.k==='svc',arr=svc?A.data.services:A.data.addons,i=+el.dataset.i,dir=+el.dataset.v;let j=i+dir;while(svc&&j>=0&&j<arr.length&&arr[j].cat!==arr[i].cat)j+=dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];renderAdmin();await saveItems('順序已更新');return;}
 if(a==='rmLogo'){readShop();A.data.shop.logo='';renderAdmin();return;}
 if(a==='saveShop'){readShop();if(!A.data.shop.shop){toast('請填寫店名');return;}A.busy=true;renderAdmin();const r=await api('adminSaveShop',{pw:A.pw,shop:A.data.shop,deposit:A.data.deposit,other:A.data.other});A.busy=false;if(r.ok){await refreshCfg();toast('店家設定已儲存');}else toast(r.error||'儲存失敗');renderAdmin();return;}
 if(a==='saveKeys'){const g=id=>(document.getElementById(id)||{}).value||'';readShop();
  const keys={merchantId:g('k-mid').trim(),hashKey:g('k-key').trim(),hashIv:g('k-iv').trim(),lineToken:g('k-line').trim(),test:document.getElementById('k-test').checked};
  if((keys.merchantId||keys.hashKey||keys.hashIv)&&!A.data.cardReady&&!(keys.merchantId&&keys.hashKey&&keys.hashIv)){toast('第一次設定藍新，商店代號、HashKey、HashIV 三個都要填');return;}
  A.busy=true;renderAdmin();const r=await api('adminSaveKeys',{pw:A.pw,keys});A.busy=false;
  if(r.ok){toast('金鑰已儲存');await loadAdmin();}else{toast(r.error||'儲存失敗');renderAdmin();}return;}
 if(a==='cf'){A.cf=el.dataset.v;renderAdmin();return;}
 if(a==='rmon'){A.rym=ymAdd(A.rym,+el.dataset.v);renderAdmin();return;}
 if(a==='unowner'){const r=await api('adminUnsetOwner',{pw:A.pw});if(r.ok){toast('已停止傳 LINE 給你');loadAdmin();}else toast(r.error);return;}
 if(a==='nbOpen'){A.nb={serviceId:(A.data.services[0]||{}).id||'',addons:[],date:A.data.today,time:'12:00',name:'',phone:'',note:'',status:'已確認'};renderNb();return;}
 if(a==='nbClose'){if(!A.busy){A.nb=null;renderNb();}return;}
 if(a==='nbSave'){const n=A.nb;n.err='';if(!n.name.trim()||!/^09\d{8}$/.test(n.phone.replace(/[\s-]/g,''))){n.err='請填寫姓名和 09 開頭的10碼手機';renderNb();return;}if(!n.date||!n.time){n.err='請填寫日期和時間';renderNb();return;}
  A.busy=true;renderNb();const r=await api('adminBook',Object.assign({pw:A.pw,force:!!el.dataset.force},n));A.busy=false;
  if(r.ok){A.nb=null;renderNb();toast('已新增預約');A.filter='all';loadAdmin();}else{n.err=r.error;n.conflict=r.code==='conflict';renderNb();}return;}
 if(a==='mlay'){A.menu.layout=el.dataset.v;renderAdmin();return;}
 if(a==='mimgOff'){A.menuImg=null;renderAdmin();return;}
 if(a==='mpub'){publishMenu();return;}
 if(a==='moff'){A.busy=true;renderAdmin();const r=await api('adminRichMenuOff',{pw:A.pw});A.busy=false;if(r.ok){toast('已從 LINE 移除');loadAdmin();}else{toast(r.error);renderAdmin();}return;}
 if(a==='logout'){A.data=null;A.pw='';try{sessionStorage.removeItem('lash-admin-pw');}catch(e){}renderAdmin();return;}
}

/* ---------- 事件 ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;if(a==='agree'||a==='consent')return;if(b.classList.contains('mask')&&e.target!==b)return;(ADMIN?adminAct:clientAct)(a,b);});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset&&t.dataset.a==='agree')B.agree=t.checked;if(t.dataset&&t.dataset.a==='consent')B.consent=t.checked;
 if(t.dataset&&t.dataset.nadd&&A.nb){const id=t.dataset.nadd;A.nb.addons=t.checked?A.nb.addons.concat(id):A.nb.addons.filter(x=>x!==id);A.nb.conflict=false;}
 if(t.dataset&&t.dataset.n&&A.nb&&t.tagName==='SELECT'){A.nb[t.dataset.n]=t.value;A.nb.conflict=false;}
 if(t.dataset&&t.dataset.mt!==undefined&&A.menu){A.menu.cells[+t.dataset.mt].type=t.value;renderAdmin();}
 if(t.dataset&&t.dataset.img&&t.files&&t.files[0]){const kind=t.dataset.img;if(kind==='menu'){const u=URL.createObjectURL(t.files[0]);const im=new Image();im.onload=()=>{A.menuImg=im;renderAdmin();};im.onerror=()=>toast('這張圖片無法讀取');im.src=u;return;}let url;try{url=await shrink(t.files[0],kind==='logo'?200:280);}catch(_){toast('這張圖片無法讀取，請換一張');return;}
  if(kind==='logo'){readShop();A.data.shop.logo=url;renderAdmin();toast('店標已換好，記得按「儲存店家設定」');}else if(A.edit){A.edit.item.img=url;renderEdit();}}});
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f)B.f[f]=e.target.value;const ek=e.target.dataset&&e.target.dataset.e;if(ek&&A.edit)A.edit.item[ek]=e.target.value;const nk=e.target.dataset&&e.target.dataset.n;if(nk&&A.nb){A.nb[nk]=e.target.value;A.nb.conflict=false;}const mk=e.target.dataset&&e.target.dataset.m;if(mk&&A.menu){const[k,i]=mk.split(':');if(i!==undefined)A.menu.cells[+i][k]=e.target.value;else A.menu[k]=e.target.value;drawPreview();}if(e.target.id==='q'){A.q=e.target.value;const pos=e.target.selectionStart;renderAdmin();const q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(pos,pos);}catch(_){}}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&B.open&&!B.busy){B.open=false;renderModal();}if(e.key==='Escape'&&A.edit&&!A.busy){A.edit=null;renderEdit();}if(e.key==='Escape'&&A.nb&&!A.busy){A.nb=null;renderNb();}if(e.key==='Enter'&&e.target.id==='pw'){e.preventDefault();adminAct('login');}});
addEventListener('hashchange',()=>location.reload());

/* ---------- 啟動 ---------- */
(async()=>{
 await initLiff(!ADMIN);
 const r=await api('config',{},true);
 if(r.ok){cfg=r;if(!ADMIN){cfg.services=cfg.services.filter(x=>x.on!==false);cfg.addons=(cfg.addons||[]).filter(x=>x.on!==false);}document.title=(cfg.shop||'美睫')+(ADMIN?'｜後台':'｜線上預約');}else S.err=r.error;
 if(ADMIN){if(A.pw){A.busy=true;renderAdmin();loadAdmin();}else renderAdmin();}
 else{const t=new URLSearchParams(location.search).get('tab');if(cfg&&(t==='mine'||t==='contact')){S.tab=t;if(t==='mine'&&(DEMO||idToken)){loadMine();return;}}render();}
})();
}
</script>
</body>
</html>
